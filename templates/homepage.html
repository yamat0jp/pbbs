<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録ページ (Registration)</title>
<style>
        /* ページ全体の基本的なスタイル */
        body {
            font-family: sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
        }

        /* フォームを囲む白いカードのスタイル */
        main {
            background: #ffffff;
            max-width: 400px; /* 横並びにする場合は 500px など広めにします */
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        /* 縦並びのレイアウト（おすすめ） */
        form div {
            display: flex;
            flex-direction: column; /* これでラベルと入力欄が縦に並びます */
            margin-bottom: 20px;
        }

        /* 横並びにしたい場合は、上の form div の内容を以下に書き換えます：
        form div {
            display: grid;
            grid-template-columns: 140px 1fr;
            align-items: center;
            margin-bottom: 20px;
        }
        */

        /* ラベルのスタイル */
        label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        /* 入力欄のスタイル */
        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        /* 入力欄を選択した時のスタイル */
        input:focus {
            border-color: #007bff;
            outline: none;
        }

        /* 送信ボタンのスタイル */
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* ヘッダーの配置調整 */
        header {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <p>ようこそ、だれでもご参加いただけます / <a href="/login">ログイン</a></p>
        <p>無料のレンタル掲示板</p>
    </header>

    <main>
        <h2>初めて登録する</h2>
        <form action="/register" method="POST">
            <div>
                <label for="username">ユーザー名 (Username):</label>@Msg.name
                <input type="text" id="username" name="username" value="@Name.name" required>
            </div>
            <div>
                <label for="nickname">ニックネーム※公開 (Nickname):</label>@Msg.tag
                <!-- 必須にしたい場合は末尾に required を追加してください -->
                <input type="text" id="nickname" name="nickname" value="@Name.tag" required>
            </div>
            <div>
                <label for="email">メールアドレス (Email):</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">パスワード (Password):</label>
                <input type="password" id="password" name="password" required minlength="8">
            </div>
            <button type="submit">登録 (Register)</button>
        </form>
    </main>
    <div>
        <p>登録するだけで簡単に掲示板をレンタルできます。リンクを張ることであなたの運営しているサイトと連絡できます。
        まずは気軽に試してみましょう。掲示板内に広告が入ります。</p>
        <p>違法活動の温床とならないように設置されましたら管理者として巡回を行い責任を果たしましょう。</p>
    </div>
</body>
</html>
