<!doctype html>
<html>
<head><meta charset=utf-8><title>報告申請画面</title>
<link rel=stylesheet href="/css/main.css"></head>

<body>
@if Data.bool {
    <p>ご協力ありがとうございました</p>
} @else {
    @Import .\templates\main.html {Data = main}
    <p>宜しければ何かお書き添えください</p>
    <form action="/alert/@Page.user/@Page.title/@Page.id" method="post" accept-charset="UTF-8">
    <textarea name=com></textarea><p style=text-align:center><input name=admit type=submit value="送信">
    <input type="HIDDEN" name="id" value="@Page.id">
}
</form>
<a href="/bbs/@Page.user/@Page.title?recno=@Page.id">もどる</a>
</body></html>
