<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事一覧 - カスタムCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <main class="max-w-3xl mx-auto px-4 py-12">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">最新の記事</h1>

        <div class="space-y-6">
            <!-- articles データセットのレコード数だけループ -->
            @ForEach (var article in articles) {
            <article class="bg-white p-4 rounded-lg shadow-sm flex flex-col sm:flex-row gap-6 hover:shadow-md transition-shadow">

                <!-- アイキャッチ画像 -->
                <img src="@article.thumbnail_url" alt="@article.title" class="w-full sm:w-48 h-32 object-cover rounded-md">

                <div class="flex-1 flex flex-col justify-center">
                    <div class="flex items-center space-x-3 mb-2">
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">@article.category</span>
                        <span class="text-gray-500 text-sm">@article.formatted_date</span>
                    </div>

                    <h2 class="text-xl font-bold mb-2">
                        <!-- 詳細ページへのリンク。スラッグをURLパラメータとして渡す -->
                        <a href="/article/view?slug=@article.slug" class="hover:text-blue-600">@article.title</a>
                    </h2>
                </div>

            </article>
            }
        </div>
    </main>
</body>
</html>
