<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事の削除 - 管理画面</title>
    <link rel="stylesheet" href="/css/main.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <!-- 全体を中央に配置し、余白を持たせるコンテナ -->
    <div class="container py-5" style="max-width: 900px;">

        <!-- 管理画面風のカードデザイン -->
        <div class="card shadow-sm">
            <div class="card-header bg-white text-center py-3">
                <h5 class="mb-0">記事の削除</h5>
            </div>

            <div class="card-body">
                <form method="post" action="/admin/@Page.database/@Page.title">

                    <!-- テーブルをレスポンシブ対応に -->
                    <div class="table-responsive">
                        <!-- Bootstrapのテーブルクラス（枠線あり、ホバーエフェクトあり） -->
                        <table class="table table-bordered table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" class="text-center" style="width: 60px;">選択</th>
                                    <th scope="col" style="width: 80px;">番号</th>
                                    <th scope="col" style="width: 150px;">名前</th>
                                    <th scope="col">コメント</th>
                                    <th scope="col" style="width: 180px;">投稿日時</th>
                                </tr>
                            </thead>
                            <tbody>
                            @ForEach articles {
                                <tr>
                                    <td class="text-center">
                                        <!-- Bootstrapのチェックボックスデザイン -->
                                        <input class="form-check-input" type="checkbox" name="datas[]" value="@loop.titlenum">
                                    </td>
                                    <td>@loop.titlenum</td>
                                    <td>@loop.name</td>
                                    <!-- コメントの省略（text-truncateクラスを使用） -->
                                    <td class="text-truncate" style="max-width: 250px;">
                                        @loop.comment
                                    </td>
                                    <td>@loop.datetime</td>
                                </tr>
                            }
                            </tbody>
                        </table>
                    </div>

                    <!-- ボタンエリア -->
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button type="submit" class="btn btn-danger px-4">削除する</button>
                        <button type="reset" class="btn btn-outline-secondary px-4">取り消し</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- フッターと戻るボタンエリア -->
        <section class="mt-4 text-center">
            <div class="mb-3">
                @Import ./templates/footer.html {Data = Info, Items}
            </div>
            <a href="/bbs/@Page.database/@Page.title" class="text-decoration-none text-secondary">
                &larr; もどる
            </a>
        </section>

    </div>
</body>
</html>
