<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@title - カスタムCMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <main class="max-w-3xl mx-auto px-4 py-12 relative">
        <a href="/" class="text-blue-600 hover:underline mb-6 inline-block">&larr; 一覧へ戻る</a>

        <article class="bg-white p-8 rounded-lg shadow-sm">
            <img src="@thumbnail_url" alt="@title" class="w-full h-64 object-cover rounded-md mb-8">

            <div class="flex items-center text-sm text-gray-500 mb-4 space-x-4">
                <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">@category</span>
                <span>公開日: @created_at</span>
            </div>

            <h1 class="text-4xl font-bold mb-8">@title</h1>

            <div class="mb-8 text-sm text-gray-600">タグ: @tags</div>

            <div class="prose max-w-none">
                @content
            </div>
        </article>
    </main>
</body>
</html>
