<div id="comment-@Data.titlenum" class="comment-card">
    <div class="comment-meta">
      <span class="comment-number">#@Data.titlenum</span>
      <span class="comment-author">@Data.name</span>
      <time class="comment-time" datetime="@Data.datetime">@Data.datetime</time>
      <span class="comment-alert"><a href="/alert/@Data.dbname/@Data.url/@Data.titlenum">alert</a></span>
    </div>
  <pre class="comment-body">
    @Data.comment
    @Data.code
  </pre>
</div>
