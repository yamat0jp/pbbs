<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿検索</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
  /* ベース設定 */
:root {
  --primary-color: #007bff;
  --bg-color: #f5f6fa;
  --text-color: #333;
}

body {
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  padding: 20px;
}

/* 検索コンテナのレイアウト */
.search-container {
  max-width: 600px;
  margin: 0 auto;
  background: #ffffff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

.text-center {
  text-align: center;
}

h1 {
  font-size: 1.5rem;
  margin-top: 0;
  margin-bottom: 5px;
}

/* フォーム部品のレイアウト */
.form-group {
  margin: 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.form-group label {
  font-weight: bold;
  margin-bottom: 8px;
}

.search-input {
  width: 100%;
  max-width: 300px;
  padding: 10px;
  font-size: 1rem;
  border: 1px solid #ccc;
  border-radius: 4px;
}

/* ラジオボタンエリア */
.filter-group {
  border: none;
  padding: 0;
  margin: 0 0 25px;
  display: flex;
  justify-content: center;
  gap: 20px;
}

.visually-hidden {
  display: none;
}

.radio-label {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* 送信ボタン */
.submit-group {
  text-align: center;
  margin-bottom: 30px;
}

.btn-submit {
  padding: 10px 40px;
  font-size: 1rem;
  font-weight: bold;
  background-color: var(--primary-color);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  transition: background-color 0.2s;
}

.btn-submit:hover {
  background-color: #0056b3;
}

/* 検索結果・ナビゲーション */
.search-results {
  margin-top: 20px;
  border-top: 1px solid #eee;
  padding-top: 20px;
}

.nav-links {
  text-align: center;
  margin-top: 30px;
}

.btn-back {
  color: var(--primary-color);
  text-decoration: none;
}

.btn-back:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>
  <main class="search-container">
    <form action="/super_search" method="post" class="search-form">
      <h1 class="text-center">投稿検索</h1>
      <p class="text-center">AND検索</p>

      <div class="form-group">
        <label for="search-word1">検索ワード</label>
        <input type="text" id="search-word1" name="word1" value="@Word.name" class="search-input">
      </div>

      <fieldset class="filter-group">
        <legend class="visually-hidden">検索対象</legend>
        <label class="radio-label">
          <input type="radio" name="filter" value="name">
          <span>名前から検索</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="filter" value="com" checked>
          <span>本文から検索</span>
        </label>
      </fieldset>

      <div class="submit-group">
        <button type="submit" class="btn-submit">検索</button>
      </div>
    </form>

    <section class="search-results">
      @ForEach Supers {
        @loop.dbname / @loop.title
        @Import ./templates/main.html {Data = loop, Bool = Word}
      }
    </section>

    <div class="nav-links">
      <a href="/top" class="btn-back">戻る</a>
    </div>
  </main>
</body>
</html>
