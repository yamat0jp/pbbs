<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">

<html>
  <head>
    <title>退会受付</title>
  </head>

  <body>
    <h2>退会処理</h2>
    <p>一度退会されますとデータはすべて消去されます</p>
    @if Data.bool {
    <form method="post" action="/exit/@Page.user">
        <div>ユーザー名：@Data.name</div>
        <div>
            <label>パスワード:</label>
            <input type="password" name="password" required>
        </div>
        <div>
            <label><input type="CHECKBOX" name="check" value="yes">退会に同意します</label>
        </div>
        <input type="SUBMIT" value="退会">
    </form> } @else {@Data.tag}
  </body>
</html>
