<!DOCTYPE html>
<html lang="en">
<head>

  <body>

    <div class="input-header" style="width:80%;align:center">

      <p><br></p>
          <label for=text1>本文<span style=color:red>必須</span></label>

            お名前

    </form>
    </div>


    <p><br /></p>
    <div style=text-align:center>

    <div style=text-align:center>
