<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/main.css">
  </head>

  <body>
    <p>ad</p>
    <p>@Ad</p>


    <div class="input-header" style="width:80%;align:center">
    <a name=top></a>
    <form action=/bbs/@Page.database/@Page.title method="post" accept-charset="UTF-8">
      <p><br></p>
          <label for=text1>本文<span style=color:red>必須</span></label>
          <textarea style="font-size:1.75em;width:100%" name="comment" rows=4
                required placeholder="コメントなどを入力してください."></textarea>
          <p>コードが書き足せます<p>
          <textarea style="width:60%" rows=4 name="code" placeholder="code space"></textarea>

      <p><br></p>
            お名前
            <input name="name" value="">
            <input class="btn btn-primary ml-3" type="submit" value="送信">
    </form>
    </div>


    <p><br /></p>
    <div style=text-align:center>
        <p>@Page.database</p>
        @Import ./templates/footer.html {Data = Footer, Items}
        <p><a href=/members/@Page.database>戻る</a></p>
    </div>


    @Ad
    @ForEach articles {
        @if (loop.RecNo = Count.id) {@Ad}
        @Import ./templates/main.html {Data = loop}
    }
    @Ad


    <div style=text-align:center>
        <a id=bottom></a>
        @Import ./templates/footer.html {Data = Footer, Items}
        <p><a href=/members/@Page.database>戻る</a></p>
        <p><a href=/admin/@Page.database/@Page.title/@Page.page>管理者</a></p>
    </div>


  </body>
</html>
